<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .quadrado{
            width: 250px;
            height: 250px;
            background-color: blue;
            margin: 25px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        p{
            position: relative;
            z-index: 99;
            color: black;
        }
        #btn,#btn-dark{
            border-radius: 10px;
            padding: 10px;
            color: blanchedalmond;
            background-color:brown;
            border: none;
            position: relative;
            z-index: 2;           
        }
        #btn:hover, #btn-dark:hover{
            scale: 110%;
        }
        .dark-theme{
            background-color: black;
        }
    </style>
</head>
<body >
    <div id="quadro" class="quadrado"></div>
    <button id="btn">muda cor</button>
    <button id="btn-dark">Dark theme</button>
    <p>Contador de clicks dark theme: <b>0</b> </p>

    <script src="event.js"></script>
</body>
</html>
